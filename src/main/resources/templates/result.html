<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Validation Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .result-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 50px;
        }
        .result-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .result-message {
            font-size: 18px;
        }
        .btn-custom {
            background-color: #6c757d;
            color: #ffffff;
        }
        .btn-custom:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body class="container mt-5">
   <div class="modal fade" id="validationModal" tabindex="-1" aria-labelledby="validationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" th:classappend="${validationResult.valid} ? 'border-success' : 'border-danger'">
            <div class="modal-header">
                <h5 class="modal-title" id="validationModalLabel">Validation Result</h5>
            </div>
            <div class="modal-body">
                <div th:class="${validationResult.valid} ? 'text-success' : 'text-danger'"
                     th:text="${validationResult.message}">
                </div>
            </div>
            <div class="modal-footer">
                <a href="/" class="btn btn-custom">Upload Another File</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var validationModal = new bootstrap.Modal(document.getElementById('validationModal'));
        validationModal.show();
    });
</script>
</body>
</html>
